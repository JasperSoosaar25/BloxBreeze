name: BloxBreeze
options:
  bundleIdPrefix: com.jasper
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  BloxBreeze:
    type: application
    platform: iOS
    sources:
      - path: BloxBreeze
        excludes:
          - Resources
          - Info.plist
      - path: BloxBreeze/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasper.bloxbreeze
        PRODUCT_NAME: BloxBreeze
        INFOPLIST_FILE: BloxBreeze/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
    scheme:
      gatherCoverageData: true
      testTargets:
        - BloxBreezeTests
  BloxBreezeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BloxBreezeTests
    dependencies:
      - target: BloxBreeze
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasper.bloxbreeze.tests
        GENERATE_INFOPLIST_FILE: YES
