name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"]; phones = [device for runtime in devices.values() for device in runtime if device.get("isAvailable", True) and device.get("name", "").startswith("iPhone")]; print(next((device["udid"] for device in phones if "Pro" in device["name"]), phones[0]["udid"]))')"
          test -n "$SIMULATOR_ID"
          echo "Using iPhone simulator $SIMULATOR_ID"
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: >-
          xcodebuild test
          -project BloxBreeze.xcodeproj
          -scheme BloxBreeze
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}'
          CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned device app
        run: >-
          xcodebuild build
          -project BloxBreeze.xcodeproj
          -scheme BloxBreeze
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=''

      - name: Package IPA for KravaSigner
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/BloxBreeze.app package/Payload/
          cd package
          /usr/bin/zip -qry ../BloxBreeze-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BloxBreeze-unsigned-ipa
          path: BloxBreeze-unsigned.ipa
          if-no-files-found: error
